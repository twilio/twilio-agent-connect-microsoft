name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supply-chain hardening: refuse to resolve any package version uploaded to
# PyPI within the last 2 days, quarantining freshly-published (potentially
# compromised) releases. Applies to every `uv` invocation in all jobs.
# Installs from the committed uv.lock are unaffected (locked versions are
# already pinned); this only gates re-resolution.
env:
  UV_EXCLUDE_NEWER: "2 days"

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras

      - name: Run ruff check
        run: |
          . .venv/bin/activate
          echo "Python files to check:"
          find src getting_started tests deploy -name "*.py" -type f | wc -l
          echo ""
          uv run ruff check src getting_started tests deploy

      - name: Run ruff format check
        run: |
          . .venv/bin/activate
          uv run ruff format --check src getting_started tests deploy

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras

      - name: Run mypy
        run: |
          . .venv/bin/activate
          echo "Type checking: src/tac_microsoft getting_started deploy"
          MYPYPATH=src uv run mypy --explicit-package-bases src/tac_microsoft getting_started deploy

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras

      - name: Run tests
        run: |
          . .venv/bin/activate
          uv run pytest

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Build package
        run: |
          uv build

      - name: Check package metadata
        run: |
          uv venv
          . .venv/bin/activate
          pip install twine
          twine check dist/*

      - name: Test package installation
        run: |
          python -m venv test-env
          . test-env/bin/activate
          pip install dist/*.whl
          python -c "import tac_microsoft; print('Successfully imported tac_microsoft')"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  all-checks:
    name: All Checks Passed
    needs: [lint, type-check, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs['type-check'].result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
