[project]
name = "twilio-agent-connect-microsoft"
version = "2.0.0"
description = "Azure integrations for Twilio Agent Connect (TAC) - connectors for Azure AI agent services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Twilio", email = "help@twilio.com" }
]
keywords = ["twilio", "agent", "azure", "agent-framework", "voice-live", "conversational-ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "twilio-agent-connect>=2.1.0,<3",
    "pydantic>=2.0.0",
    "python-dotenv",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
# FastAPI-based TAC Server (uses TAC core's server extras)
server = [
    "twilio-agent-connect[server]>=2.1.0,<3",
]

# Microsoft Agent Framework connector
agent-framework = [
    "agent-framework>=1.7.0,<2",
    "azure-identity",
]

# Azure AI Foundry Voice Live connector
voice-live = [
    "websockets>=13.0",
]

# Hosted Agents in Foundry Agent Service server.
#
# Voice URL config is read from TACConfig (voice_public_domain /
# voice_websocket_path / voice_action_path), which lives in base `tac`,
# so this extra does NOT need tac[server]. The Starlette types the server
# uses come transitively from azure-ai-agentserver-core.
hosted-agents = [
    "twilio-agent-connect>=2.1.0,<3",
    "azure-ai-agentserver-invocations>=1.0.0b4,<2",
    "azure-ai-agentserver-core>=2.0.0b4,<3",
]

# CosmosDB session store
cosmos = [
    "azure-cosmos>=4.7.0",
    "azure-identity",
]

# Development dependencies (includes all runtime features)
dev = [
    "agent-framework>=1.7.0,<2",
    "azure-identity",
    "azure-cosmos>=4.7.0",
    "websockets>=13.0",
    # Server dependencies (via TAC core)
    "twilio-agent-connect[server]>=2.1.0,<3",
    # Hosted Agents server (tac[server] is already pulled in above).
    "azure-ai-agentserver-invocations>=1.0.0b4,<2",
    "azure-ai-agentserver-core>=2.0.0b4,<3",
    # Dev tools
    "ruff>=0.8.0,<1",
    "mypy>=1.0.0,<2",
    "pytest>=7.0.0,<8",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
]

[project.urls]
Homepage = "https://github.com/twilio/twilio-agent-connect-microsoft"
Documentation = "https://github.com/twilio/twilio-agent-connect-microsoft#readme"
Repository = "https://github.com/twilio/twilio-agent-connect-microsoft"
Issues = "https://github.com/twilio/twilio-agent-connect-microsoft/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_microsoft"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "deploy",
    "getting_started",
    "uv.lock",
    "logo.svg",
    "CLAUDE.md",
    "tests",
]

[tool.uv]
# Allow prereleases: the agent-framework chain pins prerelease-only deps
# (e.g. azure-search-documents==11.7.0b2), so the lock can only be resolved
# with prereleases enabled. Recording it here makes uv.lock reproducible.
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"getting_started/*" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["tac_microsoft"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
# Pydantic models (TwiMLOptions, channel configs, etc.) come from core `tac`.
# The pydantic plugin teaches mypy that `Field(None, ...)` supplies a default,
# so partial construction (e.g. TwiMLOptions(language=...)) type-checks. Mirrors
# core TAC's mypy config.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "agent_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.cosmos.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.ai.agentserver.*"
ignore_missing_imports = true
