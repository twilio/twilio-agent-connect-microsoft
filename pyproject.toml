[project]
name = "tac-azure"
version = "0.1.0"
description = "Azure integrations for Twilio Agent Connect (TAC) - connectors for Azure AI agent services"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Twilio", email = "help@twilio.com" }
]
keywords = ["twilio", "agent", "azure", "agent-framework", "voice-live", "conversational-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core TAC from GitHub
    "twilio-agent-connect @ git+https://github.com/twilio-innovation/twilio-agent-connect-python.git@10bd99c",
    "pydantic>=2.0.0",
    "python-dotenv",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
# FastAPI-based TAC Server (uses TAC core's server extras)
server = [
    "twilio-agent-connect[server] @ git+https://github.com/twilio-innovation/twilio-agent-connect-python.git@10bd99c",
]

# Microsoft Agent Framework connector
agent-framework = [
    "agent-framework",
    "agent-framework-azure-ai",
    "azure-identity",
]

# Azure AI Foundry Voice Live connector
voice-live = [
    "websockets>=13.0",
]

# CosmosDB session store
cosmos = [
    "azure-cosmos>=4.7.0",
    "azure-identity",
]

# Development dependencies (includes all runtime features)
dev = [
    "agent-framework",
    "agent-framework-azure-ai",
    "azure-identity",
    "azure-cosmos>=4.7.0",
    "websockets>=13.0",
    # Server dependencies (via TAC core)
    "twilio-agent-connect[server] @ git+https://github.com/twilio-innovation/twilio-agent-connect-python.git@10bd99c",
    # Dev tools
    "ruff>=0.8.0,<1",
    "mypy>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/twilio-innovation/azure-twilio-agent-connect-python"
Documentation = "https://github.com/twilio-innovation/azure-twilio-agent-connect-python#readme"
Repository = "https://github.com/twilio-innovation/azure-twilio-agent-connect-python"
Issues = "https://github.com/twilio-innovation/azure-twilio-agent-connect-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tac_azure"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"getting_started/*" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["tac_azure"]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "agent_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.cosmos.*"
ignore_missing_imports = true
