[project]
name = "tac-azure"
version = "0.1.0"
description = "POC: Microsoft Agent Framework + Twilio Agent Connect (TAC) integration"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "agent-framework-azure-ai",
    "azure-identity",
    "pydantic>=2.0.0",
    "python-dotenv",
    "tac[server] @ git+ssh://git@github.com/twilio-internal/twilio-agent-connect-python.git@5b61bdf",
    "truststore>=0.10.4",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
